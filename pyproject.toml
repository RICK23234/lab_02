[build-system]
requires = ['setuptools>=64.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'streamstats'
version = '1.0.0'
requires-python = '>=3.10'

[project.optional-dependencies]
dev = ['pytest==8.4.2', 'ruff==0.7.4']

[tool.setuptools.packages.find]
where = ['scr']

[tool.pytest.ini_options]
testpaths = ['tests']